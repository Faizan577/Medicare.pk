<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { width: 250px; position: fixed; top: 0; left: 0; height: 100%; background: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; }
        .sidebar a:hover { background: #495057; }
        .content { margin-left: 250px; padding: 20px; }
        .card { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="text-center">Smart Queue</h4>
        <a href="#book"><i class="fas fa-calendar"></i> Book Appointment</a>
        <a href="#queue"><i class="fas fa-list"></i> Join Queue</a>
        <a href="#status"><i class="fas fa-clock"></i> Queue Status</a>
        <a href="#doctors"><i class="fas fa-user-md"></i> Doctors</a>
        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
    <div class="content">
        <h1>Patient Portal</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card" id="book">
                    <div class="card-body">
                        <h5 class="card-title">Book Appointment</h5>
                        <form id="bookForm">
                            <select class="form-control mb-3" id="doctorSelect" required></select>
                            <input type="datetime-local" class="form-control mb-3" id="dateTime" required>
                            <button type="submit" class="btn btn-primary">Book</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card" id="queue">
                    <div class="card-body">
                        <h5 class="card-title">Join Queue</h5>
                        <form id="queueForm">
                            <select class="form-control mb-3" id="queueDoctorSelect" required></select>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="emergency">
                                <label class="form-check-label">Emergency</label>
                            </div>
                            <button type="submit" class="btn btn-warning">Join Queue</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="card" id="status">
                    <div class="card-body">
                        <h5 class="card-title">Queue Status</h5>
                        <p>Position: <span id="position">-</span></p>
                        <p>Estimated Wait: <span id="wait">-</span></p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card" id="doctors">
                    <div class="card-body">
                        <h5 class="card-title">Available Doctors</h5>
                        <ul id="doctorList" class="list-group"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadDoctors() {
            const res = await fetch('/doctors');
            const doctors = await res.json();
            const selects = ['doctorSelect', 'queueDoctorSelect'];
            selects.forEach(id => {
                const select = document.getElementById(id);
                select.innerHTML = doctors.map(d => `<option value="${d.id}">${d.name} - ${d.specialty}</option>`).join('');
            });
            document.getElementById('doctorList').innerHTML = doctors.map(d => `<li class="list-group-item">${d.name} - ${d.specialty}</li>`).join('');
        }

        document.getElementById('bookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                doctorId: document.getElementById('doctorSelect').value,
                dateTime: document.getElementById('dateTime').value
            };
            const res = await fetch('/book-appointment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message || result.error);
        });

        document.getElementById('queueForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                doctorId: document.getElementById('queueDoctorSelect').value,
                emergency: document.getElementById('emergency').checked
            };
            const res = await fetch('/join-queue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message || result.error);
            if (result.token) alert(`Your token: ${result.token}`);
        });

        async function updateStatus() {
            const res = await fetch('/queue-status', { headers: { 'Authorization': `Bearer ${token}` } });
            const status = await res.json();
            document.getElementById('position').textContent = status.position || 'Not in queue';
            document.getElementById('wait').textContent = status.waitTime ? `${status.waitTime} min` : '-';
        }

        loadDoctors();
        updateStatus();
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
