<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { width: 250px; position: fixed; top: 0; left: 0; height: 100%; background: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; }
        .sidebar a:hover { background: #495057; }
        .content { margin-left: 250px; padding: 20px; }
        .card { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="text-center">Smart Queue</h4>
        <a href="#queue"><i class="fas fa-list"></i> Patient Queue</a>
        <a href="#appointments"><i class="fas fa-calendar"></i> Appointments</a>
        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
    <div class="content">
        <h1>Doctor Portal</h1>
        <div class="card" id="queue">
            <div class="card-body">
                <h5 class="card-title">Patient Queue</h5>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Token</th>
                            <th>Patient</th>
                            <th>Emergency</th>
                            <th>Position</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="queueTable"></tbody>
                </table>
            </div>
        </div>
        <div class="card" id="appointments">
            <div class="card-body">
                <h5 class="card-title">Upcoming Appointments</h5>
                <ul id="appointmentList" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadDashboard() {
            const res = await fetch('/doctor-dashboard', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('queueTable').innerHTML = data.queues.map(q => `
                <tr>
                    <td>${q.token}</td>
                    <td>${q.name}</td>
                    <td>${q.emergency ? 'Yes' : 'No'}</td>
                    <td>${q.position}</td>
                    <td><button class="btn btn-success btn-sm" onclick="callNext(${q.id})">Call Next</button></td>
                </tr>
            `).join('');
            document.getElementById('appointmentList').innerHTML = data.appointments.map(a => `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${a.date_time} - ${a.name}
                    <button class="btn btn-primary btn-sm" onclick="completeAppointment(${a.id})">Complete</button>
                </li>
            `).join('');
        }

        async function callNext(queueId) {
            const res = await fetch(`/call-next/${queueId}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await res.json();
            alert(result.message || result.error);
            loadDashboard();
        }

        async function completeAppointment(apptId) {
            const res = await fetch(`/complete-appointment/${apptId}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await res.json();
            alert(result.message || result.error);
            loadDashboard();
        }

        loadDashboard();
        setInterval(loadDashboard, 10000);
    </script>
</body>
</html>
