<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal - MediQueue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        <link href="css/doctor.css" rel="stylesheet">

    <link href="css/doctor.css" rel="stylesheet">

    <link href="css/doctor.css" rel="stylesheet">
    <link href="css/doctor.css" rel="stylesheet">

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-hospital"></i>
            <span>MediQueue</span>
        </div>
        <nav>
            <a href="#queue" class="active">
                <i class="fas fa-list"></i>
                <span>Patient Queue</span>
            </a>
            <a href="#appointments">
                <i class="fas fa-calendar"></i>
                <span>Appointments</span>
            </a>
            <a href="#" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </nav>
        <div class="user-profile">
            <div class="user-profile-info">
                <div class="user-avatar" id="userInitial">D</div>
                <div>
                    <div class="user-name" id="userName">Doctor</div>
                    <div class="user-role">Doctor</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div class="header">
            <h1>Doctor Dashboard</h1>
        </div>

        <div class="grid-container">
            <!-- Patient Queue Card -->
            <div class="card" id="queue">
                <div class="card-header">
                    <i class="fas fa-list"></i>
                    <h5>Patient Queue</h5>
                </div>
                <div class="card-body">
                    <div id="queueList"></div>
                </div>
            </div>

            <!-- Appointments Card -->
            <div class="card" id="appointments">
                <div class="card-header">
                    <i class="fas fa-calendar"></i>
                    <h5>Scheduled Appointments</h5>
                </div>
                <div class="card-body">
                    <div id="appointmentList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!user) window.location.href = 'index.html';

        document.getElementById('userName').textContent = user.name;
        document.getElementById('userInitial').textContent = user.name.charAt(0).toUpperCase();

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/doctor-dashboard', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();

                if (data.queues.length > 0) {
                    document.getElementById('queueList').innerHTML = data.queues.map(q => `
                        <div class="queue-item">
                            <div class="queue-info">
                                <div class="queue-token"><i class="fas fa-ticket-alt"></i> ${q.token}</div>
                                <div class="queue-name">${q.name}</div>
                                <div class="queue-meta">
                                    <span><i class="fas fa-sort-numeric-up"></i> Position: ${q.position}</span>
                                    ${q.emergency ? '<span class="badge-emergency"><i class="fas fa-exclamation-triangle"></i> Emergency</span>' : ''}
                                </div>
                            </div>
                            <button class="btn-action btn-call-next" onclick="callNext(${q.id})">
                                <i class="fas fa-phone"></i> Call Next
                            </button>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('queueList').innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No patients in queue</p></div>';
                }

                if (data.appointments.length > 0) {
                    document.getElementById('appointmentList').innerHTML = data.appointments.map(a => `
                        <div class="appointment-item">
                            <div class="appointment-info">
                                <div class="appointment-time"><i class="fas fa-clock"></i> ${new Date(a.date_time).toLocaleString()}</div>
                                <div class="appointment-patient">${a.name}</div>
                            </div>
                            <button class="btn-action btn-complete" onclick="completeAppointment(${a.id})">
                                <i class="fas fa-check"></i> Complete
                            </button>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('appointmentList').innerHTML = '<div class="empty-state"><i class="fas fa-calendar-check"></i><p>No appointments scheduled</p></div>';
                }
            } catch (err) {
                console.error('Error loading dashboard:', err);
            }
        }

        async function callNext(queueId) {
            if (confirm('Call next patient?')) {
                try {
                    const res = await fetch(`/call-next/${queueId}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const result = await res.json();
                    loadDashboard();
                } catch (err) {
                    alert('Error calling next patient');
                }
            }
        }

        async function completeAppointment(apptId) {
            if (confirm('Mark appointment as completed?')) {
                try {
                    const res = await fetch(`/complete-appointment/${apptId}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const result = await res.json();
                    loadDashboard();
                } catch (err) {
                    alert('Error completing appointment');
                }
            }
        }

        loadDashboard();
        setInterval(loadDashboard, 10000);
    </script>
</body>
</html>
