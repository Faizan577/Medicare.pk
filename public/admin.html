<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { width: 250px; position: fixed; top: 0; left: 0; height: 100%; background: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; }
        .sidebar a:hover { background: #495057; }
        .content { margin-left: 250px; padding: 20px; }
        .card { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="text-center">Smart Queue</h4>
        <a href="#stats"><i class="fas fa-chart-bar"></i> Statistics</a>
        <a href="#doctors"><i class="fas fa-user-md"></i> Manage Doctors</a>
        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
    <div class="content">
        <h1>Admin Panel</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card" id="stats">
                    <div class="card-body">
                        <h5 class="card-title">Statistics</h5>
                        <p>Total Patients: <span id="totalPatients">-</span></p>
                        <p>Total Appointments: <span id="totalAppointments">-</span></p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Add Doctor</h5>
                        <form id="addDoctorForm">
                            <div class="mb-3">
                                <input type="text" class="form-control" placeholder="Name" id="docName" required>
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control" placeholder="Email" id="docEmail" required>
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control" placeholder="Specialty" id="docSpecialty" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Doctor</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="card" id="doctors">
            <div class="card-body">
                <h5 class="card-title">Doctors</h5>
                <ul id="doctorList" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadDashboard() {
            const res = await fetch('/admin-dashboard', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('totalPatients').textContent = data.totalPatients;
            document.getElementById('totalAppointments').textContent = data.totalAppointments;
            document.getElementById('doctorList').innerHTML = data.doctors.map(d => `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${d.name} - ${d.specialty}
                    <button class="btn btn-danger btn-sm" onclick="removeDoctor(${d.id})">Remove</button>
                </li>
            `).join('');
        }

        document.getElementById('addDoctorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('docName').value,
                email: document.getElementById('docEmail').value,
                specialty: document.getElementById('docSpecialty').value
            };
            const res = await fetch('/add-doctor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message || result.error);
            loadDashboard();
        });

        async function removeDoctor(doctorId) {
            const res = await fetch(`/remove-doctor/${doctorId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await res.json();
            alert(result.message || result.error);
            loadDashboard();
        }

        loadDashboard();
    </script>
</body>
</html>
