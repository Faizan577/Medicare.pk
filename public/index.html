<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Queue System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .hero { text-align: center; }
        .btn-custom { margin: 10px; padding: 15px 30px; font-size: 18px; border-radius: 50px; transition: all 0.3s; }
        .btn-custom:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container hero">
        <h1 class="display-4">Smart Queue System</h1>
        <p class="lead">Efficient queue management for hospitals and clinics</p>
        <button class="btn btn-light btn-custom" onclick="showRegister()">Get Started</button>
        <button class="btn btn-outline-light btn-custom" onclick="showLogin()">Login</button>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Name" id="regName" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" id="regEmail" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" placeholder="Password" id="regPassword" required>
                        </div>
                        <div class="mb-3">
                            <select class="form-control" id="regRole" required>
                                <option value="patient">Patient</option>
                                <option value="doctor">Doctor</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div class="mb-3" id="specialtyField" style="display:none;">
                            <input type="text" class="form-control" placeholder="Specialty" id="regSpecialty">
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" placeholder="Password" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showRegister() {
            new bootstrap.Modal(document.getElementById('registerModal')).show();
        }
        function showLogin() {
            new bootstrap.Modal(document.getElementById('loginModal')).show();
        }

        document.getElementById('regRole').addEventListener('change', function() {
            document.getElementById('specialtyField').style.display = this.value === 'doctor' ? 'block' : 'none';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                role: document.getElementById('regRole').value,
                specialty: document.getElementById('regSpecialty').value
            };
            const res = await fetch('/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
            alert(result.message || result.error);
            if (res.ok) bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };
            const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
            if (res.ok) {
                localStorage.setItem('token', result.token);
                localStorage.setItem('user', JSON.stringify(result.user));
                window.location.href = result.user.role === 'patient' ? 'patient.html' : result.user.role === 'doctor' ? 'doctor.html' : 'admin.html';
            } else {
                alert(result.error);
            }
        });
    </script>
</body>
</html>
